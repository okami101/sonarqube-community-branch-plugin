name: build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.init.outputs.version }}
      release: ${{ steps.init.outputs.release }}
      sonarqube: ${{ steps.init.outputs.sonarqube }}
      tag: ${{ steps.init.outputs.tag }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Init
        id: init
        run: |
          VERSION=$(grep "version" gradle.properties | cut -d'=' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi
          SONARQUBE_VERSION=$(grep '^SONARQUBE_VERSION=' .env | cut -d'=' -f2)
          SONARQUBE_VERSION=${SONARQUBE_VERSION%-community}
          echo "sonarqube=${SONARQUBE_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=$(echo "${SONARQUBE_VERSION}" | cut -d'.' -f1,2)" >> $GITHUB_OUTPUT

  snapshot:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: jdk
          distribution: 'zulu'
      -
        name: Cache deps
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      -
        name: Build
        run: |
          ./gradlew clean build
      -
        name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: build/libs/*.jar

  build-ui:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      -
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: sonarqube-webapp/yarn.lock
      -
        name: Set up symlink
        run: ./sonarqube-webapp-addons/setup.sh
      -
        name: Install dependencies
        working-directory: sonarqube-webapp
        run: yarn install --no-immutable
      -
        name: Build frontend
        working-directory: sonarqube-webapp
        run: yarn nx run sq-server:build
      -
        name: Create build artifact
        working-directory: sonarqube-webapp/apps/sq-server/build/webapp
        run: zip -r ${{ github.workspace }}/sonarqube-webapp.zip ./*
      -
        name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: webapp-build
          path: sonarqube-webapp.zip

  release:
    # Publishes the jar and webapp zip as the release of the targeted SonarQube
    # version (e.g. 26.11, from .env). The tag follows the latest master commit.
    needs: [prep, snapshot, build-ui]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      -
        name: Rename jar
        run: mv dist/sonarqube-community-branch-plugin-*.jar dist/sonarqube-community-branch-plugin.jar
      -
        name: Move tag
        run: |
          git tag -f ${{ needs.prep.outputs.tag }}
          git push -f origin ${{ needs.prep.outputs.tag }}
      -
        name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          name: ${{ needs.prep.outputs.tag }}
          body: "Community Branch Plugin ${{ needs.prep.outputs.version }} for SonarQube ${{ needs.prep.outputs.sonarqube }} (commit ${{ github.sha }})."
          files: |
            dist/sonarqube-community-branch-plugin.jar
            dist/sonarqube-webapp.zip

  sonar:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: jdk
          distribution: 'zulu'
      -
        name: Cache deps
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      -
        name: Test and Sonar
        if: ${{ env.SONAR_TOKEN != null }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew test sonar \
              -Dsonar.gradle.skipCompile=true \
              -Dsonar.pullrequest.provider=github \
              -Dsonar.pullrequest.github.repository=${{ github.repository }} \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=${SONAR_ORG_KEY} \
              -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
              -Dsonar.pullrequest.key=${{ github.event.number }} \
              -Dsonar.pullrequest.base=${{ github.base_ref }}
          elif [ "${{ needs.prep.outputs.release }}" = 'true' ]; then
            ./gradlew test sonar \
              -Dsonar.gradle.skipCompile=true \
              -Dsonar.pullrequest.provider=github \
              -Dsonar.pullrequest.github.repository=${{ github.repository }} \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=${SONAR_ORG_KEY} \
              -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
              -Dsonar.projectVersion=${{ needs.prep.outputs.version }}
          else
            ./gradlew test sonar \
              -Dsonar.gradle.skipCompile=true \
              -Dsonar.pullrequest.provider=github \
              -Dsonar.pullrequest.github.repository=${{ github.repository }} \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=${SONAR_ORG_KEY} \
              -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
              -Dsonar.branch.name=${GITHUB_REF##*/}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
