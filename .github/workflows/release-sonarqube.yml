name: release-sonarqube

# Runs after a successful `build` workflow on a push to master, and publishes
# the jar and webapp zip that `build` produced as a GitHub release tagged with
# the targeted SonarQube version (e.g. 26.11), read from .env. If the release
# already exists, its tag is moved to the built commit and its assets replaced.
# The release holds:
#   - sonarqube-community-branch-plugin.jar
#   - sonarqube-webapp.zip

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-sonarqube
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      -
        name: Read versions
        id: versions
        run: |
          SONARQUBE_VERSION=$(grep '^SONARQUBE_VERSION=' .env | cut -d'=' -f2)
          SONARQUBE_VERSION=${SONARQUBE_VERSION%-community}
          TAG=$(echo "${SONARQUBE_VERSION}" | cut -d'.' -f1,2)
          PLUGIN_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          {
            echo "tag=${TAG}"
            echo "sonarqube=${SONARQUBE_VERSION}"
            echo "plugin=${PLUGIN_VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Release ${TAG}: SonarQube ${SONARQUBE_VERSION}, plugin ${PLUGIN_VERSION}"
      -
        name: Download artifacts from build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts
      -
        name: Prepare assets
        run: |
          mkdir dist
          JARS=(artifacts/snapshot/sonarqube-community-branch-plugin-*.jar)
          if [[ ${#JARS[@]} -ne 1 || ! -f "${JARS[0]}" ]]; then
            echo "::error::Expected exactly one plugin jar, found: ${JARS[*]}"
            exit 1
          fi
          cp "${JARS[0]}" dist/sonarqube-community-branch-plugin.jar
          cp artifacts/webapp-build/sonarqube-webapp.zip dist/sonarqube-webapp.zip
          ls -l dist
      -
        name: Create or update release
        env:
          TAG: ${{ steps.versions.outputs.tag }}
          NOTES: "Community Branch Plugin ${{ steps.versions.outputs.plugin }} for SonarQube ${{ steps.versions.outputs.sonarqube }} (commit ${{ github.event.workflow_run.head_sha }})."
        run: |
          # Point the tag at the built commit, creating it if needed. Done
          # before the release, as `gh release create` ignores --target when
          # the tag already exists.
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "Moving tag ${TAG} to ${SHA}"
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" \
              -f sha="${SHA}" -F force=true > /dev/null
          else
            echo "Creating tag ${TAG} on ${SHA}"
            gh api -X POST "repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${SHA}" > /dev/null
          fi

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Updating release ${TAG}"
            gh release edit "${TAG}" --notes "${NOTES}"
            gh release upload "${TAG}" --clobber \
              dist/sonarqube-community-branch-plugin.jar \
              dist/sonarqube-webapp.zip
          else
            echo "Creating release ${TAG}"
            gh release create "${TAG}" \
              --verify-tag \
              --title "${TAG}" \
              --notes "${NOTES}" \
              dist/sonarqube-community-branch-plugin.jar \
              dist/sonarqube-webapp.zip
          fi
